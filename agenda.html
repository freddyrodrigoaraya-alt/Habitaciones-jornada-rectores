<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Programa | Jornada de Rectores 2026</title>

  <style>
    :root {
      --burdeo: #7f1d2d;
      --rojo: #d9363e;
      --rojo-suave: #fff0f1;
      --azul: #1c7aa8;
      --verde: #177a58;
      --naranja: #cc7517;
      --gris-900: #24262a;
      --gris-700: #525861;
      --gris-300: #d8dadd;
      --blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--gris-900);
      background: #f4f5f6;
      font-family: Arial, Helvetica, sans-serif;
    }

    .contenedor {
      width: min(100% - 32px, 900px);
      margin: 0 auto;
    }

    header {
      color: var(--blanco);
      background: var(--burdeo);
      border-bottom: 7px solid var(--rojo);
      padding: 30px 0 27px;
    }

    .marca {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: #ffe4e5;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .marca::before {
      content: "";
      width: 10px;
      height: 28px;
      display: inline-block;
      background: var(--rojo);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.8rem);
      line-height: .96;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }

    .subtitulo {
      margin: 12px 0 0;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      color: #ffe9ea;
    }

    main {
      padding: 24px 0 44px;
    }

    .ahora {
      padding: 22px;
      background: var(--blanco);
      border: 1px solid var(--gris-300);
      border-top: 6px solid var(--rojo);
      box-shadow: 0 7px 20px rgba(45, 31, 35, .08);
    }

    .etiqueta {
      margin: 0 0 7px;
      color: var(--burdeo);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .estado-titulo {
      margin: 0;
      font-size: clamp(1.35rem, 5vw, 2rem);
      line-height: 1.1;
    }

    .estado-hora {
      margin: 9px 0 0;
      color: var(--gris-700);
      font-size: 1.03rem;
      font-weight: 700;
    }

    .estado-descripcion {
      margin: 10px 0 0;
      color: var(--gris-700);
      line-height: 1.45;
    }

    .proxima {
      margin: 18px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--gris-300);
      color: var(--gris-700);
    }

    .proxima strong {
      color: var(--gris-900);
    }

    .nota-fecha {
      margin: 14px 0 0;
      color: var(--gris-700);
      font-size: .87rem;
      line-height: 1.4;
    }

    .objetivos {
      margin: 26px 0 0;
      padding: 20px 22px;
      background: var(--blanco);
      border: 1px solid var(--gris-300);
      border-left: 6px solid var(--burdeo);
    }

    .objetivos h2 {
      margin: 0 0 13px;
      color: var(--burdeo);
      font-size: 1.2rem;
    }

    .objetivos ol {
      margin: 0;
      padding-left: 22px;
    }

    .objetivos li {
      margin: 0 0 12px;
      color: var(--gris-700);
      line-height: 1.48;
    }

    .objetivos li:last-child {
      margin-bottom: 0;
    }

    .controles {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 28px 0 20px;
    }

    button {
      appearance: none;
      border: 1px solid var(--burdeo);
      border-radius: 3px;
      padding: 11px 16px;
      color: var(--burdeo);
      background: var(--blanco);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    button:hover,
    button:focus-visible {
      outline: 3px solid rgba(217, 54, 62, .22);
      outline-offset: 2px;
    }

    button.activo {
      color: var(--blanco);
      background: var(--burdeo);
    }

    .dia {
      display: none;
    }

    .dia.activo {
      display: block;
    }

    .encabezado-dia {
      margin: 0 0 15px;
      color: var(--burdeo);
      font-size: clamp(1.25rem, 5vw, 1.75rem);
    }

    .itinerario {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .actividad {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 14px;
      position: relative;
      padding: 15px 0;
      border-bottom: 1px solid var(--gris-300);
    }

    .actividad:last-child {
      border-bottom: 0;
    }
