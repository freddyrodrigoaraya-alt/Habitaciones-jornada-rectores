<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Programa | Jornada de Rectores 2026</title>

  <style>
    :root {
      --burdeo: #7f1d2d;
      --rojo: #d9363e;
      --azul: #1c7aa8;
      --verde: #177a58;
      --naranja: #cc7517;
      --gris-900: #24262a;
      --gris-700: #525861;
      --gris-300: #d8dadd;
      --fondo: #f4f5f6;
      --blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--gris-900);
      background: var(--fondo);
      font-family: Arial, Helvetica, sans-serif;
    }

    .contenedor {
      width: min(100% - 32px, 900px);
      margin: 0 auto;
    }

    header {
      color: var(--blanco);
      background: var(--burdeo);
      border-bottom: 7px solid var(--rojo);
      padding: 30px 0 27px;
    }

    .marca {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      color: #ffe4e5;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .marca::before {
      content: "";
      width: 10px;
      height: 28px;
      background: var(--rojo);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.8rem);
      line-height: .96;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }

    .subtitulo {
      margin: 12px 0 0;
      color: #ffe9ea;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
    }

    main {
      padding: 24px 0 44px;
    }

    .bloque {
      margin-bottom: 24px;
      padding: 22px;
      background: var(--blanco);
      border: 1px solid var(--gris-300);
      box-shadow: 0 6px 16px rgba(45, 31, 35, .06);
    }

    .bloque h2 {
      margin: 0 0 14px;
      color: var(--burdeo);
      font-size: clamp(1.3rem, 5vw, 1.75rem);
    }

    .introduccion {
      border-top: 6px solid var(--rojo);
    }

    .introduccion p {
      margin: 0;
      color: var(--gris-700);
      line-height: 1.5;
    }

    .objetivos {
      border-left: 6px solid var(--burdeo);
    }

    .objetivos ol {
      margin: 0;
      padding-left: 22px;
    }

    .objetivos li {
      margin: 0 0 13px;
      color: var(--gris-700);
      line-height: 1.5;
    }

    .objetivos li:last-child {
      margin-bottom: 0;
    }

    .leyenda {
      margin: 0 0 16px;
      color: var(--gris-700);
      font-size: .92rem;
      line-height: 1.45;
    }

    .actividad {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 14px;
      padding: 15px 0;
      border-top: 1px solid var(--gris-300);
    }

    .hora {
      color: var(--burdeo);
      font-weight: 800;
    }

    .actividad h3 {
      margin: 0;
      font-size: 1.04rem;
      line-height: 1.25;
    }

    .actividad p {
      margin: 5px 0 0;
      color: var(--gris-700);
      font-size: .93rem;
      line-height: 1.4;
    }

    .tipo {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 7px;
      border-radius: 2px;
      color: var(--blanco);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .oracion,
    .celebracion {
      background: var(--burdeo);
    }

    .trabajo,
    .diferenciada {
      background: var(--azul);
    }

    .plenario {
      background: var(--verde);
    }

    .pausa,
    .comida {
      background: var(--naranja);
    }

    .cierre {
      background: var(--gris-700);
    }

    .aviso {
      border-left: 6px solid var(--rojo);
    }

    .aviso p {
      margin: 0;
      color: var(--gris-700);
      line-height: 1.5;
    }

    footer {
      padding: 0 16px 30px;
      color: var(--gris-700);
      font-size: .8rem;
      text-align: center;
    }

    @media (max-width: 440px) {
      .contenedor {
        width: min(100% - 24px, 900px);
      }

      header {
        padding: 26px 0 23px;
      }

      .bloque {
        padding: 18px;
      }

      .actividad {
        grid-template-columns: 65px 1fr;
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="contenedor">
      <p class="marca">Red de Colegios Salesianos</p>
      <h1>Jornada de<br>Rectores
